name: ci
# Upgrade safety net (see TESTING.md). Every PR (incl. Dependabot), master, and agent/** branches
# (an agent gets CI without opening a PR). Nothing is pushed.
on:
  pull_request:
  push:
    branches: [master, 'agent/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    name: server tests (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    container: node:${{ matrix.node }}-alpine
    strategy:
      fail-fast: false
      matrix:
        node: ['26'] # Node 20 is EOL; 26 = the base image line (hosh-management#5)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm ci --no-audit --no-fund
      - run: node --test --test-reporter=spec test/server.test.js

  smoke:
    name: container smoke
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: instantshit:smoke
      - name: Node runtime guardrail (CVE-2026-111497, hosh-management#5)
        run: bash scripts/check-node-version.sh instantshit:smoke
      - name: Guardrail rejects an unpatched Node (test of the test)
        run: |
          set -uo pipefail
          if out=$(bash scripts/check-node-version.sh node:24.21.0-alpine 2>&1); then
            echo "$out"; echo "::error::guardrail accepted node:24.21.0-alpine (unpatched)"; exit 1
          fi
          printf '%s\n' "$out" | sed 's/::error::/expected rejection: /' # no error annotation for the expected failure
          grep -q 'runs Node 24.21.0 < 24.22.3' <<<"$out" || { echo "::error::guardrail failed for another reason"; exit 1; }
      - run: bash scripts/smoke.sh instantshit:smoke
      # migration safety net: the box's legacy compose (uid 1000, :80, bind mount ./data) keeps working
      - name: Legacy compose mode (box today)
        run: bash scripts/smoke-compose.sh legacy instantshit:smoke
      # hosh-deploy: docker-compose.example.yml + .env.example (uid 10001, read-only, PORT=8000, named volume),
      # register validation, POST_DEPLOY, 1 GiB upload under the compose mem_limit
      - name: hosh-deploy compose mode (template)
        run: bash scripts/smoke-compose.sh template instantshit:smoke
