# Read ONCE by `hosh-deploy register instantshit` on the box (box standard, Decision #16), which validates
# the compose hardening and pins the result in /etc/hosh-deploy/apps/instantshit.conf. Changing this file
# in the repo changes nothing on the box until someone re-registers there.
SERVICE=instantshit
IMAGE_REPO=ghcr.io/pazka/instantshit
IMAGE_VAR=APP_IMAGE
ENV_FILE=instantshit.env
HOST=pad.hosh.it
BIND=127.0.0.1:9136
HEALTH=/healthz
# Capability smoke run INSIDE the container after each deploy (argv, no shell; non-zero => auto-rollback).
# READ-ONLY (never replaces the live pad/file): /healthz (data dir writable), page, Socket.IO client,
# title, limits, /all shape, Socket.IO handshake + namespace connect (my-id).
POST_DEPLOY=node /checks/postdeploy.js http://127.0.0.1:8000
REPO=pazka/instant_shit
