<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Instant Shit</title>
    <link href="quill.snow.css" rel="stylesheet">
    <link href="style.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body>
<div id="text-edit">
    <div class="section">
        <h1>Copy/Paste Text</h1>
        <span class="update-info">Last update: <span id="txtMaj">never</span></span>
    </div>
    <span class="hidden" id="error"></span>

    <div id="current-text"></div>
</div>

<div id="file-management">
    <div class="section">
        <h1>Copy/Paste File</h1>
        <span class="update-info">Last update: <span id="fileMaj">never</span></span>
    </div>

    <span class="hidden" id="file-error"></span>

    <div id="drop-zone">
        <input onchange="handleFileUpdate()" type="file" name="newFile" id="new-file"/>
        <label for="new-file" id="drop-zone-label">
            <img src="upload.svg" alt="upload icon" class="icon"/>
            <span class="drop-main">Drag &amp; drop a file here</span>
            <span class="drop-sub">or click to browse — max <span id="maxSize">2 Go</span></span>
        </label>
        <div id="upload-status" class="hidden">
            <span id="upload-status-text">Uploading…</span>
            <progress id="progress" max="1" value="0"></progress>
        </div>
    </div>

    <div id="download-field" class="hidden">
        <a class="btn" href="/file" id="download">
            <img src="download.svg" alt="download icon" class="icon"/>
            <span class="file-infos">
                <span id="fileNameMaj"></span>
                <span id="fileSizeMaj" class="file-size"></span>
            </span>
        </a>
    </div>
    <p id="no-file-yet">No file has been shared yet.</p>
</div>

<script src="socket.io.js"></script>
<script src="quill.js"></script>
<script>

    //EDITOR INIT ##########################################################
    var editor = new Quill('#current-text', {
        theme: 'snow'
    });

    function setEditorContentDelta(val, where = 0) {
        var range = editor.getSelection();
        editor.updateContents(val.delta, "api")
        if (range) {
            if (range.index > where)
                editor.setSelection(range.index + 1, range.length, "api")
            else
                editor.setSelection(range.index, range.length, "api")
        }
    }

    function setEditorContentFull(quillObj, where = 0) {
        var range = editor.getSelection();
        editor.setContents(quillObj, "api")
        if (range) {
            if (range.index > where)
                editor.setSelection(range.index + 1, range.length, "api")
            else
                editor.setSelection(range.index, range.length, "api")
        }
    }

    editor.on('text-change', function (delta, oldDelta, source) {
        if (source === 'user') {
            socket.emit('txt_update', {
                content: editor.getContents(),
                delta: delta,
                source: source
            });
        }
    });

    // SOCKET Send/receive ##################################################
    var mySocketId;

    const socket = io();

    socket.on('connect', () => {
        console.info("connected with the server")
    });
    socket.on('my-id', (id) => {
        mySocketId = id
    });

    function fmtTime(t) {
        return (new Date(t)).toLocaleDateString() + " " + (new Date(t)).toLocaleTimeString()
    }

    function fmtSize(bytes) {
        if (!bytes && bytes !== 0) return ""
        if (bytes >= 1024 * 1024 * 1024) return (bytes / (1024 * 1024 * 1024)).toFixed(2) + " Go"
        if (bytes >= 1024 * 1024) return (bytes / (1024 * 1024)).toFixed(1) + " Mo"
        if (bytes >= 1024) return (bytes / 1024).toFixed(1) + " Ko"
        return bytes + " o"
    }

    function showError(elId, msg) {
        const el = document.getElementById(elId)
        el.innerText = msg || ""
        el.className = msg ? "" : "hidden"
    }

    socket.on("new_text", (txt) => {
        document.getElementById("txtMaj").innerText = fmtTime(txt.time)
        showError("error", txt.error)
        if (txt.error) return

        if (txt.from === mySocketId) {
            return;
        }

        // after the server dropped throttled updates, deltas are unreliable:
        // reload the full content instead
        if (txt.resync) {
            setEditorContentFull(txt.val.content)
        } else {
            setEditorContentDelta(txt.val)
        }
    })

    socket.on("new_file", (file) => {
        setFileInfo(file.val, file.size, file.time)
    })

    function setFileInfo(name, size, time) {
        const hasFile = !!name
        document.getElementById("download-field").className = hasFile ? "" : "hidden"
        document.getElementById("no-file-yet").className = hasFile ? "hidden" : ""
        if (!hasFile) return
        document.getElementById("fileMaj").innerText = fmtTime(time)
        document.getElementById("fileNameMaj").innerText = name
        document.getElementById("fileSizeMaj").innerText = fmtSize(size)
    }

    //Upload #######################################################################
    var fileInput = document.getElementById('new-file'),
        progress = document.getElementById('progress'),
        dropZone = document.getElementById('drop-zone'),
        uploadStatus = document.getElementById('upload-status'),
        uploadStatusText = document.getElementById('upload-status-text')

    var maxFileSize = 2 * 1024 * 1024 * 1024
    var uploading = false

    function handleFileUpdate() {
        if (fileInput.files.length > 0)
            sendFile(fileInput.files[0])
    }

    function setUploading(state) {
        uploading = state
        dropZone.className = state ? "uploading" : ""
        uploadStatus.className = state ? "" : "hidden"
        document.getElementById("drop-zone-label").className = state ? "hidden" : ""
        if (!state) fileInput.value = ""
    }

    function sendFile(file) {
        showError("file-error", "")

        if (uploading) {
            showError("file-error", "An upload is already running, wait for it to finish")
            return
        }
        if (file.size > maxFileSize) {
            showError("file-error", "File too big ! Max is " + fmtSize(maxFileSize) + ", yours is " + fmtSize(file.size))
            return
        }

        setUploading(true)

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/newFile');

        xhr.upload.addEventListener('progress', function (e) {
            progress.value = e.loaded;
            progress.max = e.total;
            if (e.total > 0)
                uploadStatusText.innerText = "Uploading… " + Math.round(e.loaded / e.total * 100) + "% (" + fmtSize(e.loaded) + " / " + fmtSize(e.total) + ")"
        });

        xhr.onreadystatechange = () => {
            if (xhr.readyState === XMLHttpRequest.DONE) {
                setUploading(false)
                try {
                    const res = JSON.parse(xhr.responseText)
                    if (!res.status)
                        showError("file-error", res.message || "Upload failed")
                } catch (e) {
                    showError("file-error", xhr.status === 429
                        ? "Too many uploads, try again in a few minutes"
                        : "Upload failed (" + (xhr.status || "network error") + "), try again")
                }
            }
        }

        var form = new FormData();
        form.append('newFile', file);
        xhr.send(form);
    }

    // Drag & drop #################################################################
    ;['dragenter', 'dragover'].forEach(evt =>
        dropZone.addEventListener(evt, e => {
            e.preventDefault()
            e.stopPropagation()
            if (!uploading) dropZone.classList.add('drag-over')
        }))
    ;['dragleave', 'drop'].forEach(evt =>
        dropZone.addEventListener(evt, e => {
            e.preventDefault()
            e.stopPropagation()
            dropZone.classList.remove('drag-over')
        }))
    dropZone.addEventListener('drop', e => {
        if (uploading) return
        if (e.dataTransfer.files && e.dataTransfer.files.length > 0)
            sendFile(e.dataTransfer.files[0])
    })
    // dropping anywhere else must not make the browser navigate away
    window.addEventListener('dragover', e => e.preventDefault())
    window.addEventListener('drop', e => e.preventDefault())

    //Initial data ################################################################
    function getAllData() {
        var xhr = new XMLHttpRequest();
        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                let data = JSON.parse(xhr.responseText)
                if (data.txt.val) setEditorContentFull(data.txt.val)
                document.getElementById("txtMaj").innerText = fmtTime(data.txt.time)
                setFileInfo(data.file.val, data.file.size, data.file.time)
            }
        };
        xhr.open('GET', '/all');
        xhr.send();
    }

    getAllData();

    function getLimits() {
        var xhr = new XMLHttpRequest();
        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                try {
                    maxFileSize = JSON.parse(xhr.responseText).maxFileSize
                    document.getElementById("maxSize").innerText = fmtSize(maxFileSize)
                } catch (e) { /* keep default */ }
            }
        };
        xhr.open('GET', '/limits');
        xhr.send();
    }

    getLimits()

    function getTitle() {
        var xhr = new XMLHttpRequest();
        xhr.onload = function () {
            if (xhr.status >= 200 && xhr.status < 300) {
                document.title = xhr.responseText
            }
        };
        xhr.open('GET', '/title');
        xhr.send();
    }

    getTitle()
</script>
</body>

</html>
